      - name: method
        type: enum
        required: true
        values: ["attachments", "batchDelete", "batchModify", "create", "cse", "delegates", "delete", "filters", "forwardingAddresses", "import", "insert", "modify", "patch", "send", "sendAs", "stop", "trash", "untrash", "update", "updateAutoForwarding", "updateImap", "updateLanguage", "updatePop", "updateVacation", "watch"]
        description: The API method to call on that resource.
      - name: params
        type: string
        description: >-
          URL and query parameters as a JSON object string, e.g.
          '{"userId": "me", "maxResults": 10}'. Most methods need at least an id.
      - name: body
        type: string
        description: >-
          Request body as a JSON object string, for methods that take one
