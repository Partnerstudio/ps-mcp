    binary: gws
    title: Write Gmail
    description: >-
      Mutating Gmail API calls: messages, threads, drafts, labels, filters and
      mailbox settings. Includes delete methods, which permanently remove data.
      Pass parameters as JSON in `params` and the request body as JSON in
      `body`. Use gws_schema to check what a method expects.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: true
    output: json
    params:
      - name: resource
        type: string
        required: true
        description: >-
          First path segment after the service, e.g. "users" for Gmail,
