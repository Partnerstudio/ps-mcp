      - name: resource
        type: string
        required: true
        description: >-
          First path segment after the service, e.g. "users" for Gmail,
          "files" for Drive, "events" for Calendar. Use gws_schema to check.
      - name: subresource
        type: string
        description: >-
          Second path segment when the resource nests, e.g. "messages" in
          `gmail users messages list`. Omit when there is none.
      - name: detail
        type: string
        description: >-
          Third path segment, only for deeply nested resources such as
          `gmail users messages attachments get`. Rarely needed.
      - name: method
        type: enum
        required: true
        values: ["create", "delete", "run", "update", "updateContent"]
        description: The API method to call on that resource.
      - name: params
        type: string
        description: >-
          URL and query parameters as a JSON object string, e.g.
          '{"userId": "me", "maxResults": 10}'. Most methods need at least an id.
      - name: body
        type: string
        description: >-
          Request body as a JSON object string, for methods that take one
          (create, update, patch, send).
    argv:
      - "script"
      - "{{resource}}"
      - "{{subresource}}"
      - "{{detail}}"
      - "{{method}}"
      - ["--params", "{{params}}"]
      - ["--json", "{{body}}"]
      - "--format"
      - "json"
  # END GENERATED

  # --- gws helpers ----------------------------------------------------------
  # Thin, ergonomic wrappers gws ships for the most common operations. They take
  # named flags instead of raw JSON, so they are what the model should reach for
  # first; the generic *_read / *_write tools above cover everything else.

  - name: gmail_send
    type: exec
    binary: gws
    title: Send an email
    description: >-
      Send a plain-text email. Handles RFC 2822 formatting and base64 encoding.
      For HTML bodies, attachments, CC or BCC, use gmail_write with the
      users.messages.send method instead.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: to
        type: string
        required: true
        description: Recipient email address.
      - name: subject
        type: string
        required: true
        description: Email subject line.
      - name: body
        type: string
        required: true
        description: Email body as plain text.
    argv: ["gmail", "+send", "--to", "{{to}}", "--subject", "{{subject}}", "--body", "{{body}}", "--format", "json"]

  - name: gmail_triage
    type: exec
    binary: gws
    title: Summarise unread inbox
    description: >-
      Unread inbox summary with sender, subject and date for each message.
      Use the query parameter to narrow it with Gmail search syntax.
    timeoutMs: 60000
    hints:
      readOnly: true
      destructive: false
    output: json
    params:
      - name: max
        type: integer
        description: Maximum messages to return.
      - name: query
        type: string
        description: 'Gmail search query, e.g. "from:boss@example.com is:unread".'
    argv: ["gmail", "+triage", ["--max", "{{max}}"], ["--query", "{{query}}"], "--format", "json"]

  - name: calendar_agenda
    type: exec
    binary: gws
    title: Upcoming calendar agenda
    description: >-
      Upcoming events across calendars. Defaults to the next few days; set days
      to widen the window, or calendar to restrict to one calendar.
    timeoutMs: 60000
    hints:
      readOnly: true
      destructive: false
    output: json
    params:
      - name: days
        type: integer
        description: Number of days ahead to include.
      - name: calendar
        type: string
        description: Calendar name or ID to filter to.
    argv: ["calendar", "+agenda", ["--days", "{{days}}"], ["--calendar", "{{calendar}}"], "--format", "json"]

  - name: calendar_create_event
    type: exec
    binary: gws
    title: Create a calendar event
    description: >-
      Create an event. Times are RFC 3339, e.g. "2026-09-22T10:00:00+02:00".
      Only one attendee can be given here; use calendar_write with events.insert
      for several attendees, recurrence or conferencing.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: summary
        type: string
        required: true
        description: Event title.
      - name: start
        type: string
        required: true
        description: Start time, RFC 3339.
      - name: end
        type: string
        required: true
        description: End time, RFC 3339.
      - name: calendar
        type: string
        description: Calendar ID to create in. Defaults to the primary calendar.
      - name: location
        type: string
        description: Free-text location.
      - name: description
        type: string
        description: Longer event description.
      - name: attendee
        type: string
        description: One attendee email address.
    argv:
      - "calendar"
      - "+insert"
      - "--summary"
      - "{{summary}}"
      - "--start"
      - "{{start}}"
      - "--end"
      - "{{end}}"
      - ["--calendar", "{{calendar}}"]
      - ["--location", "{{location}}"]
      - ["--description", "{{description}}"]
      - ["--attendee", "{{attendee}}"]
      - "--format"
      - "json"

  - name: drive_upload
    type: exec
    binary: gws
    title: Upload a file to Drive
    description: >-
      Upload a local file to Google Drive, optionally into a folder. The local
      path must resolve inside the work root.
    timeoutMs: 1800000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: path
        type: string
        required: true
        path: true
        description: Local file to upload.
      - name: name
        type: string
        description: Name to give the file in Drive. Defaults to the local filename.
      - name: parent
        type: string
        description: Drive folder ID to upload into.
    argv: ["drive", "+upload", ["--name", "{{name}}"], ["--parent", "{{parent}}"], "{{path}}", "--format", "json"]

  - name: sheets_get_range
    type: exec
    binary: gws
    title: Read a spreadsheet range
    description: >-
      Read cell values from a range in A1 notation, e.g. "Sheet1!A1:D20".
    timeoutMs: 60000
    hints:
      readOnly: true
      destructive: false
    output: json
    params:
      - name: spreadsheet
        type: string
        required: true
        description: Spreadsheet ID, from its URL.
      - name: range
        type: string
        required: true
        description: Range in A1 notation.
    argv: ["sheets", "+read", "--spreadsheet", "{{spreadsheet}}", "--range", "{{range}}", "--format", "json"]

  - name: sheets_append_row
    type: exec
    binary: gws
    title: Append a row to a spreadsheet
    description: >-
      Append a row of values to the end of a sheet. Give either values as a
      comma-separated list, or jsonValues as a JSON array for values containing
      commas.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: spreadsheet
        type: string
        required: true
        description: Spreadsheet ID, from its URL.
      - name: values
        type: string
        description: 'Comma-separated cell values, e.g. "Acme,2026-09-19,done".'
      - name: jsonValues
        type: string
        description: 'Cell values as a JSON array, e.g. ["Acme","a,b","done"].'
    argv: ["sheets", "+append", "--spreadsheet", "{{spreadsheet}}", ["--values", "{{values}}"], ["--json-values", "{{jsonValues}}"], "--format", "json"]

  - name: docs_append_text
    type: exec
    binary: gws
    title: Append text to a Google Doc
    description: >-
      Append plain text to the end of a document. For structured edits such as
      styling, tables or replacements, use docs_write with documents.batchUpdate.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: document
        type: string
        required: true
        description: Document ID, from its URL.
      - name: text
        type: string
        required: true
        description: Text to append.
    argv: ["docs", "+write", "--document", "{{document}}", "--text", "{{text}}", "--format", "json"]

  - name: chat_send_message
    type: exec
    binary: gws
    title: Send a Google Chat message
    description: Post a text message to a Chat space.
    timeoutMs: 60000
    hints:
      readOnly: false
      destructive: false
    output: json
    params:
      - name: space
        type: string
        required: true
        description: 'Space name, e.g. "spaces/AAAA1234".'
      - name: text
        type: string
        required: true
        description: Message text.
    argv: ["chat", "+send", "--space", "{{space}}", "--text", "{{text}}", "--format", "json"]

