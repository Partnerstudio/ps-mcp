  # --- discovery -------------------------------------------------------------

  - name: gws_schema
    type: exec
    binary: gws
    title: Look up a Google API method schema
    description: >-
      Return the parameter and request-body schema for one Google Workspace API
      method, addressed as "service.resource.method", e.g. "drive.files.list" or
      "gmail.users.messages.send". Use this before calling a *_read or *_write
      tool when unsure what a method expects.
    timeoutMs: 60000
    hints:
      readOnly: true
      destructive: false
    output: json
    params:
      - name: method
        type: string
        required: true
        description: 'Dotted method path, e.g. "calendar.events.insert".'
      - name: resolveRefs
        type: enum
        values: ["--resolve-refs"]
        description: Pass "--resolve-refs" to expand nested schema references inline.
    argv: ["schema", "{{method}}", "{{resolveRefs}}"]
