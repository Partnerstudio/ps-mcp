name: release

# One rolling release per channel. Pushing to a channel branch replaces that
# channel's artifacts, so a client only ever needs one stable URL:
#
#   .../releases/download/release-<channel>/version.json
#   .../releases/download/release-<channel>/ps-mcp.tar.gz
#
# Promotion is a merge forward: dev -> prod -> stable.
on:
  push:
    branches: [dev, prod, stable]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest      # packaging only; the tests run on macOS in ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Runtime dependencies only. Nothing is compiled, so the tarball is
      # portable; the launcher finds node through etc/binaries.conf at install.
      - run: npm ci --omit=dev --ignore-scripts

      - name: build the tarball
        id: build
        run: |
          set -eu
          CHANNEL="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          SHORT="$(git rev-parse --short HEAD)"
          BUILD="${VERSION}+${CHANNEL}.${SHORT}"
          # The asset filename carries the build, so a URL is never reused.
          # Rolling releases reuse the tag, and GitHub's CDN then serves the
          # PREVIOUS build from cache under the same asset URL -- verified: a
          # plain download returned the prior commit's tarball while the release
          # API and a cache-busted fetch both returned the new one. The checksum
          # catches it, but the updater would fail every attempt until the cache
          # expired, which looks exactly like a broken updater.
          ASSET="ps-mcp-${VERSION}-${CHANNEL}.${SHORT}.tar.gz"

          # Stamp the build INTO the tarball, so an installed copy knows what it
          # is. Without this an install has no .git and no way to answer "am I
          # current?" except by downloading and comparing bytes. The sha is not
          # in here -- it is the hash OF this file's tarball, so it lives in the
          # separate version.json asset the updater reads first.
          cat > etc/build.json <<JSON
          {
            "channel": "${CHANNEL}",
            "version": "${BUILD}",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON

          # Ship what the server needs at runtime and nothing else. No .git, no
          # tests, no CI config, and no etc/binaries.conf or etc/channel -- both
          # are machine-local and are written by `ps-mcp setup` on the target.
          tar -czf "$ASSET" \
            --exclude='etc/binaries.conf' \
            --exclude='etc/channel' \
            bin launcher src etc tools package.json package-lock.json README.md node_modules

          SHA="$(shasum -a 256 "$ASSET" | cut -d' ' -f1)"
          SIZE="$(wc -c < "$ASSET" | tr -d ' ')"

          cat > version.json <<JSON
          {
            "channel": "${CHANNEL}",
            "version": "${BUILD}",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "asset": "${ASSET}",
            "bytes": ${SIZE},
            "sha256": "${SHA}"
          }
          JSON

          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "--- version.json ---"; cat version.json

      - name: publish the channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="release-${{ steps.build.outputs.channel }}"
          TITLE="${{ steps.build.outputs.channel }} ${{ steps.build.outputs.build }}"

          # Recreate rather than edit: a rolling tag that moves is the whole
          # point, and deleting first keeps the assets from accumulating.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "$TITLE" \
            --notes "Rolling ${{ steps.build.outputs.channel }} build from ${GITHUB_SHA}. Promote with a merge forward: dev -> prod -> stable." \
            $( [ "${{ steps.build.outputs.channel }}" = "stable" ] || echo --prerelease ) \
            "$ASSET" version.json
